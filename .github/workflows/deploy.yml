name: SoulMate AI CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build Verification & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Build Verification
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci_test_secret_key_12345
          NEXTAUTH_URL: http://localhost:3000
          MONGODB_URI: mongodb://localhost:27017/ci-test
